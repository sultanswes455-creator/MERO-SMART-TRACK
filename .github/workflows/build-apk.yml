name: Build SNAK CHEATS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/workflows/build-apk.yml'
      - 'tool/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name snak_cheats .

      - name: Configure floating window
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
          """
          s = s.replace("<application", permissions + "\n    <application", 1)

          service = """
              <service
                  android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
                  android:exported="false"
                  android:foregroundServiceType="specialUse">
                  <property
                      android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="Displays manual training tools over other apps" />
              </service>
          """
          s = s.replace("</application>", service + "\n</application>", 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: snak-cheats-apk
          path: build/app/outputs/flutter-apk/app-release.apk