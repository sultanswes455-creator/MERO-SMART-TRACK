
name: Build MERO BET APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mero_bet .

      - name: Set App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MERO BET"/' android/app/src/main/AndroidManifest.xml

      - name: Set Android Compile SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Force SDK 36 in all Flutter plugins
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          changed = 0

          for file in cache.rglob("*"):
              if file.name not in ("build.gradle", "build.gradle.kts"):
                  continue

              try:
                  old = file.read_text()
                  new = old.replace("flutter.compileSdkVersion", "36")

                  new = re.sub(
                      r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)\d+',
                      r'\g<1>36',
                      new
                  )

                  if new != old:
                      file.write_text(new)
                      changed += 1
                      print("Updated:", file)

              except (OSError, UnicodeDecodeError):
                  pass

          print("Total Gradle files updated:", changed)

          picker = list(cache.glob("hosted/*/file_picker-*/android/build.gradle*"))
          for file in picker:
              print("FILE PICKER GRADLE:", file)
              print(file.read_text())
          PY

      - name: Verify Android SDK
        run: |
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mero-bet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
