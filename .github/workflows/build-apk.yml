
name: Build MERO BET APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mero_bet .

      - name: Set App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MERO BET"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mero-bet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
