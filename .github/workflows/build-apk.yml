
name: Build MERO BET APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mero_bet .

      - name: Set App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MERO BET"/' android/app/src/main/AndroidManifest.xml

      - name: Set Android Compile SDK
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Compile SDK in all plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted"
          count = 0

          for file in root.rglob("*"):
              if file.name not in ("build.gradle", "build.gradle.kts"):
                  continue

              try:
                  content = file.read_text()
                  updated = content.replace("flutter.compileSdkVersion", "36")

                  updated = re.sub(
                      r'(?m)^(\s*compileSdkVersion\s+)(\d+)',
                      lambda m: m.group(1) + ("36" if int(m.group(2)) < 36 else m.group(2)),
                      updated
                  )

                  updated = re.sub(
                      r'(?m)^(\s*compileSdk\s*=\s*)(\d+)',
                      lambda m: m.group(1) + ("36" if int(m.group(2)) < 36 else m.group(2)),
                      updated
                  )

                  if updated != content:
                      file.write_text(updated)
                      count += 1
              except (OSError, UnicodeDecodeError):
                  pass

          print(f"Updated Android plugin Gradle files: {count}")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mero-bet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
