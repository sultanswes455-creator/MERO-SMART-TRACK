
name: Build MERO AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mero_ai .

      - name: Install dependencies
        run: flutter pub get

      - name: Set compile SDK 36 for app and plugins
        shell: bash
        run: |
          set -e

          perl -0pi -e 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 36/g; s/compileSdk\s*=\s*\d+/compileSdk = 36/g; s/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 36/g; s/compileSdkVersion\s+\d+/compileSdkVersion 36/g' android/app/build.gradle.kts

          CACHE="$HOME/.pub-cache/hosted/pub.dev"

          find "$CACHE" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/android/*" -print0 |
          while IFS= read -r -d '' file; do
            perl -0pi -e 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 36/g; s/compileSdk\s*=\s*\d+/compileSdk = 36/g; s/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 36/g; s/compileSdkVersion\s+\d+/compileSdkVersion 36/g' "$file"
          done

          echo "FILE PICKER SDK:"
          grep -nE 'compileSdk|compileSdkVersion' "$CACHE"/file_picker-*/android/build.gradle* || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MERO-BET-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
