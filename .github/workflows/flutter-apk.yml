
name: Build MERO AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mero_ai .

      - name: Set app compile SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Force Android plugins to compile with API 36
        shell: bash
        run: |
          set -e
          CACHE="$HOME/.pub-cache/hosted/pub.dev"
          find "$CACHE" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/android/*" -print0 |
          while IFS= read -r -d '' file; do
            sed -i -E \
              -e 's/(compileSdkVersion[[:space:]]+)[0-9]+/\136/g' \
              -e 's/(compileSdkVersion[[:space:]]+|compileSdk[[:space:]]*=[[:space:]]*)flutter.compileSdkVersion/\136/g' \
              -e 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\136/g' \
              "$file"
          done
          grep -R -n -E 'compileSdk|compileSdkVersion' "$CACHE"/file_picker-*/android/ || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MERO-BET-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
