
name: Build MERO AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mero_ai .

      - name: Install dependencies
        run: flutter pub get

      - name: Force compile SDK 36
        shell: bash
        run: |
          set -e

          CACHE="$HOME/.pub-cache/hosted/pub.dev"

          perl -0pi -e '
            s/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 36/g;
            s/compileSdk\s*=\s*\d+/compileSdk = 36/g;
            s/\bcompileSdk\s+\d+/compileSdk 36/g;
            s/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 36/g;
            s/compileSdkVersion\s+\d+/compileSdkVersion 36/g;
          ' android/app/build.gradle.kts

          find "$CACHE" -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -path "*/android/*" -print0 |
          while IFS= read -r -d '' file; do
            perl -0pi -e '
              s/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 36/g;
              s/compileSdk\s*=\s*\d+/compileSdk = 36/g;
              s/\bcompileSdk\s+\d+/compileSdk 36/g;
              s/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 36/g;
              s/compileSdkVersion\s+\d+/compileSdkVersion 36/g;
            ' "$file"
          done

          echo "VERIFY FILE PICKER:"
          grep -nE 'compileSdk|compileSdkVersion' "$CACHE"/file_picker-*/android/build.gradle* || true

          if grep -qE 'compileSdk[[:space:]]+34|compileSdk[[:space:]]*=[[:space:]]*34' "$CACHE"/file_picker-*/android/build.gradle*; then
            echo "ERROR: file_picker is still using SDK 34"
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MERO-BET-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
